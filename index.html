<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GBTA — Grand Opening Invitation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Playfair+Display:wght@700;900&display=swap');

        :root {
            --gold: #c8a84e;
            --gold-light: #e8d48b;
            --gold-dark: #a07c2a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #faf8f4;
            font-family: 'Cormorant Garamond', serif;
        }

        /* ===== CONTAINER (CENTERED GRID STACK) ===== */
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        /* ===== ENVELOPE WRAPPER ===== */
        .envelope-scene {
            grid-area: 1 / 1;
            position: relative;
            cursor: pointer;
            transform: scale(0.95);
            opacity: 0;
            animation: envelopeIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s forwards;
            filter: drop-shadow(0 15px 35px rgba(0,0,0,0.12));
            transition: filter 0.3s ease, transform 0.3s ease;
            z-index: 5;
        }

        .envelope-scene:hover:not(.opened) {
            transform: scale(0.98);
            filter: drop-shadow(0 20px 45px rgba(0,0,0,0.18));
        }

        @keyframes envelopeIn {
            to { transform: scale(1); opacity: 1; }
        }

        .envelope-scene.opened {
            cursor: default;
        }

        .envelope-scene.fade-out {
            opacity: 0;
            transform: scale(0.85);
            transition: opacity 0.6s ease, transform 0.6s ease;
            pointer-events: none;
            display: none;
        }

        /* ===== SOLID PREMIUM ENVELOPE ===== */
        .envelope {
            position: relative;
            width: min(440px, 86vw);
            height: min(280px, 55vw);
            background: #e5d7c3;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        /* Envelope Inner Pocket Background */
        .env-inner-pocket {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, #d8c7b0 0%, #ecdcc8 100%);
            z-index: 1;
        }

        /* Side Flaps (Left & Right) */
        .env-side-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #e4d5c1 0%, #d8c6b0 100%);
            clip-path: polygon(0 0, 52% 50%, 0 100%);
            z-index: 2;
            box-shadow: 2px 0 8px rgba(0,0,0,0.04);
        }

        .env-side-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(225deg, #dfcfba 0%, #d3c0aa 100%);
            clip-path: polygon(100% 0, 48% 50%, 100% 100%);
            z-index: 2;
            box-shadow: -2px 0 8px rgba(0,0,0,0.04);
        }

        /* Bottom Solid Flap (Completely Fills Bottom Half) */
        .env-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(0deg, #d3c0a8 0%, #ddccb5 50%, #e6d7c2 100%);
            clip-path: polygon(0 100%, 50% 46%, 100% 100%);
            z-index: 3;
            box-shadow: 0 -3px 12px rgba(0,0,0,0.06);
        }

        /* Top Opening Flap */
        .env-top-flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            clip-path: polygon(0 0, 100% 0, 50% 55%);
            background: linear-gradient(180deg, #f0e3d2 0%, #e8d9c5 55%, #dfceb8 100%);
            transform-origin: top center;
            transform: rotateX(0deg);
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1), z-index 0s linear 0.6s;
            z-index: 4;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .envelope-scene.opened .env-top-flap {
            transform: rotateX(180deg);
            z-index: 1;
            transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1), z-index 0s linear 0s;
        }

        /* Wax Seal */
        .wax-seal {
            position: absolute;
            top: 54%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 52px;
            height: 52px;
            z-index: 6;
            transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .wax-seal-body {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 35% 35%, #d93d3d, #b31f1f 55%, #801212 100%);
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(130, 20, 20, 0.45),
                        inset 0 -2px 5px rgba(0, 0, 0, 0.3),
                        inset 0 2px 5px rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .wax-seal-body::before {
            content: 'G';
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.88);
            text-shadow: 0 1px 3px rgba(0,0,0,0.4);
        }

        .envelope-scene.opened .wax-seal {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0) rotate(180deg);
        }

        /* Tap Hint */
        .tap-hint {
            position: absolute;
            bottom: -45px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: #8c6a2b;
            letter-spacing: 3px;
            text-transform: uppercase;
            white-space: nowrap;
            animation: hintPulse 2.2s ease-in-out infinite;
            transition: opacity 0.4s ease;
        }

        @keyframes hintPulse {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 0.95; }
        }

        .envelope-scene.opened .tap-hint {
            opacity: 0;
            pointer-events: none;
        }

        /* ===== INVITATION CARD (TOP LAYER) ===== */
        .card-container {
            grid-area: 1 / 1;
            opacity: 0;
            transform: scale(0.92);
            pointer-events: none;
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 10;
        }

        .card-container.show {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .invitation-card {
            width: min(480px, 92vw);
            max-height: 88vh;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            background: #ffffff;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.22), 0 0 0 1px rgba(200, 168, 78, 0.35);
        }

        .invitation-card img {
            width: 100%;
            height: auto;
            max-height: 88vh;
            object-fit: contain;
            display: block;
        }

        /* Elegant Thin Gold Border */
        .card-frame {
            position: absolute;
            inset: 0;
            border: 2px solid rgba(200, 168, 78, 0.35);
            border-radius: 12px;
            pointer-events: none;
            z-index: 2;
        }

        /* Shine sweep on card */
        .card-shine {
            position: absolute;
            inset: 0;
            background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, 0.2) 48%, rgba(255, 255, 255, 0.35) 50%, rgba(255, 255, 255, 0.2) 52%, transparent 65%);
            z-index: 3;
            pointer-events: none;
            opacity: 0;
        }

        .card-container.show .card-shine {
            animation: shineOnce 2.2s ease 0.4s forwards;
        }

        @keyframes shineOnce {
            0% { opacity: 1; transform: translateX(-120%); }
            45% { opacity: 1; transform: translateX(120%); }
            100% { opacity: 0; transform: translateX(120%); }
        }

        @media (max-width: 480px) {
            .envelope { width: 88vw; height: 58vw; }
            .invitation-card { width: 92vw; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Envelope Scene -->
        <div class="envelope-scene" id="envelope">
            <div class="envelope">
                <div class="env-inner-pocket"></div>
                <div class="env-side-left"></div>
                <div class="env-side-right"></div>
                <div class="env-bottom"></div>
                <div class="env-top-flap"></div>
                <div class="wax-seal">
                    <div class="wax-seal-body"></div>
                </div>
            </div>
            <div class="tap-hint">Tap to Open</div>
        </div>

        <!-- Invitation Card (Opens directly in place) -->
        <div class="card-container" id="cardContainer">
            <div class="invitation-card">
                <div class="card-frame"></div>
                <div class="card-shine"></div>
                <img src="INVITATION-CARD.svg" alt="GBTA Invitation Card" />
            </div>
        </div>
    </div>

    <script>
        (function () {
            let opened = false;

            document.getElementById('envelope').addEventListener('click', function () {
                if (opened) return;
                opened = true;

                // Step 1: Open the flap
                this.classList.add('opened');

                // Step 2: Show card and hide envelope
                setTimeout(() => {
                    this.classList.add('fade-out');
                    document.getElementById('cardContainer').classList.add('show');
                }, 1200);
            });
        })();
    </script>
</body>
</html>
