<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GBTA — Grand Opening Invitation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Playfair+Display:wght@700;900&display=swap');

        :root {
            --env-base: #e6d7c3;
            --gold: #c8a84e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background: #faf8f4;
            font-family: 'Cormorant Garamond', serif;
        }

        /* ===== CONTAINER ===== */
        .stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* ===== MAIN INTERACTIVE WRAPPER ===== */
        .invite-wrapper {
            position: relative;
            width: min(440px, 86vw);
            height: min(280px, 55vw);
            cursor: pointer;
            perspective: 1400px;
        }

        .invite-wrapper.opened {
            cursor: default;
        }

        /* ===== ENVELOPE BOX ===== */
        .envelope-box {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: var(--env-base);
            border-radius: 0 0 8px 8px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
            transition: transform 1.8s cubic-bezier(0.25, 1, 0.4, 1), box-shadow 0.4s ease;
            z-index: 5;
        }

        .invite-wrapper:hover:not(.opened) .envelope-box {
            transform: scale(1.02);
            box-shadow: 0 20px 45px rgba(0,0,0,0.18);
        }

        /* When opened, envelope glides gently downwards, staying permanently visible underneath the card */
        .invite-wrapper.opened .envelope-box {
            transform: translateY(270px) scale(0.85);
            box-shadow: 0 25px 55px rgba(0,0,0,0.16);
        }

        /* Deep Pocket Interior Background */
        .env-pocket-bg {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, #baa084 0%, #cebba3 100%);
            border-radius: 0 0 8px 8px;
            z-index: 1;
        }

        /* ===== REALISTIC CARD EMERGING DIRECTLY FROM INSIDE ===== */
        .card-container {
            position: absolute;
            bottom: 6px;
            left: 5%;
            width: 90%;
            max-height: 56vh;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(200, 168, 78, 0.35);
            overflow: hidden;
            pointer-events: none;

            /* INITIALLY: Tucked fully inside the pocket (behind front folds z:10, in front of back flap z:1) */
            z-index: 3;
            opacity: 0;
            transform: translateY(30px) scale(0.88);
            transition: 
                opacity 0.4s ease 0.35s,
                transform 1.6s cubic-bezier(0.22, 1, 0.36, 1) 0.4s, 
                box-shadow 1.4s ease 0.4s,
                z-index 0s linear 1s;
        }

        /* WHEN OPENED: Pulls upward in front of the top flap, clears the pocket, and grows big into position */
        .invite-wrapper.opened .card-container {
            opacity: 1;
            transform: translateY(-40px) scale(1);
            z-index: 25; /* Rises in front of the entire envelope! */
            box-shadow: 0 30px 75px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(200, 168, 78, 0.45);
            pointer-events: auto;
        }

        .card-container img {
            width: 100%;
            height: auto;
            max-height: 56vh;
            object-fit: contain;
            display: block;
        }

        .card-frame {
            position: absolute;
            inset: 0;
            border: 2px solid rgba(200, 168, 78, 0.35);
            border-radius: 12px;
            pointer-events: none;
            z-index: 2;
        }

        /* Shine sweep on card */
        .card-shine {
            position: absolute;
            inset: 0;
            background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, 0.2) 48%, rgba(255, 255, 255, 0.35) 50%, rgba(255, 255, 255, 0.2) 52%, transparent 65%);
            z-index: 3;
            pointer-events: none;
            opacity: 0;
        }

        .invite-wrapper.opened .card-shine {
            animation: shineOnce 2s ease 2s forwards;
        }

        @keyframes shineOnce {
            0% { opacity: 1; transform: translateX(-120%); }
            45% { opacity: 1; transform: translateX(120%); }
            100% { opacity: 0; transform: translateX(120%); }
        }

        /* ===== ENVELOPE FRONT FOLDS ===== */
        .env-flap-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ebdcc9 0%, #d8c4ad 100%);
            clip-path: polygon(0 0, 50% 50%, 0 100%);
            z-index: 10;
            filter: drop-shadow(2px 0 3px rgba(0,0,0,0.04));
        }

        .env-flap-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(225deg, #e4d3be 0%, #d0bda5 100%);
            clip-path: polygon(100% 0, 50% 50%, 100% 100%);
            z-index: 10;
            filter: drop-shadow(-2px 0 3px rgba(0,0,0,0.04));
        }

        .env-flap-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(0deg, #cfbba3 0%, #decbb4 50%, #eadccb 100%);
            clip-path: polygon(0 100%, 50% 48%, 100% 100%);
            border-radius: 0 0 8px 8px;
            z-index: 11;
            filter: drop-shadow(0 -3px 4px rgba(0,0,0,0.05));
        }

        /* Top Opening Flap (Hinged at top) */
        .env-flap-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            clip-path: polygon(0 0, 100% 0, 50% 53%);
            background: linear-gradient(180deg, #f5e9d9 0%, #ebdcc8 55%, #dfceb8 100%);
            transform-origin: top center;
            transform: rotateX(0deg);
            transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1), z-index 0s linear 0.45s;
            z-index: 12;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.08));
        }

        .env-flap-top::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(0deg, #b89f82 0%, #ccb89e 100%);
            opacity: 0;
            transition: opacity 0.1s linear 0.45s;
        }

        /* Once opened: Flap folds upward and moves BEHIND everything (z-index: 1) */
        .invite-wrapper.opened .env-flap-top {
            transform: rotateX(180deg);
            z-index: 1;
            transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1), z-index 0s linear 0s;
        }

        .invite-wrapper.opened .env-flap-top::after {
            opacity: 1;
        }

        /* ===== WAX SEAL WITH LOGO.PNG ===== */
        .wax-seal {
            position: absolute;
            top: 52%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 54px;
            height: 54px;
            z-index: 13;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .wax-seal-body {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 35% 35%, #ffffff, #faf6ee 65%, #ebdcc8 100%);
            border-radius: 50%;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.16),
                        0 0 0 2px rgba(200, 168, 78, 0.4),
                        inset 0 -2px 5px rgba(0, 0, 0, 0.08),
                        inset 0 2px 5px rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 7px;
            overflow: hidden;
        }

        .wax-seal-body img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.15));
        }

        .invite-wrapper.opened .wax-seal {
            opacity: 0;
            transform: translate(-50%, -50%) scale(0) rotate(180deg);
        }

        /* Tap Hint */
        .tap-hint {
            position: absolute;
            bottom: -45px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: #8c6a2b;
            letter-spacing: 3px;
            text-transform: uppercase;
            white-space: nowrap;
            animation: hintPulse 2.2s ease-in-out infinite;
            transition: opacity 0.4s ease;
        }

        @keyframes hintPulse {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 0.95; }
        }

        .invite-wrapper.opened .tap-hint {
            opacity: 0;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            .invite-wrapper { width: 88vw; height: 58vw; }
            .card-container { max-height: 54vh; }
            .card-container img { max-height: 54vh; }
            .invite-wrapper.opened .card-container { transform: translateY(-35px) scale(1); }
            .invite-wrapper.opened .envelope-box { transform: translateY(220px) scale(0.85); }
        }
    </style>
</head>
<body>

    <div class="stage">
        <!-- Interactive Invitation Component -->
        <div class="invite-wrapper" id="inviteWrapper">
            
            <!-- Envelope Box (Never hides, stays below) -->
            <div class="envelope-box">
                <div class="env-pocket-bg"></div>
                <div class="env-flap-left"></div>
                <div class="env-flap-right"></div>
                <div class="env-flap-bottom"></div>
                <div class="env-flap-top"></div>

                <!-- Seal with logo.png -->
                <div class="wax-seal">
                    <div class="wax-seal-body">
                        <img src="logo.png" alt="GBTA Logo" />
                    </div>
                </div>
            </div>

            <!-- Single Real Card: nestled inside pocket, glides out above the flap into place -->
            <div class="card-container" id="cardContainer">
                <div class="card-frame"></div>
                <div class="card-shine"></div>
                <img src="INVITATION-CARD.jpeg" alt="GBTA Invitation Card" />
            </div>

            <div class="tap-hint">Tap to Open</div>
        </div>
    </div>

    <script>
        (function () {
            const wrapper = document.getElementById('inviteWrapper');
            let opened = false;

            wrapper.addEventListener('click', function () {
                if (opened) return;
                opened = true;
                wrapper.classList.add('opened');
            });
        })();
    </script>
</body>
</html>
